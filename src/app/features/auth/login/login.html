<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 via-blue-500 to-purple-600 p-4">

  <!-- CARD -->
  <div class="w-full max-w-md bg-white/90 backdrop-blur-lg rounded-2xl shadow-2xl p-8 space-y-6">

    <!-- HEADER -->
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-gray-800">
        Welcome Back
      </h1>
      <p class="text-gray-500 text-sm">
        Sign in to your MPloyChek dashboard
      </p>
    </div>

    <!-- FORM -->
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="space-y-4"
    >

      <!-- USERNAME -->
      <div>
        <label class="text-sm text-gray-600">User ID</label>
        <input
          type="text"
          formControlName="username"
          placeholder="Enter your user ID"
          class="w-full mt-1 p-3 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition"
        />
      </div>

      <!-- PASSWORD -->
      <div>
        <label class="text-sm text-gray-600">Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
          class="w-full mt-1 p-3 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition"
        />
      </div>

      <!-- ROLE -->
      <div>
        <label class="text-sm text-gray-600">Role</label>

        <select
          formControlName="role"
          class="w-full mt-1 p-3 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition"
        >
          <option value="General User">General User</option>
          <option value="Admin">Admin</option>
        </select>
      </div>

      <!-- ERROR -->
      <div *ngIf="errorMessage" class="text-red-500 text-sm text-center">
        {{ errorMessage }}
      </div>

      <!-- BUTTON -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-3 rounded-lg font-medium shadow-md hover:shadow-lg transition disabled:opacity-60"
      >
        <span *ngIf="!loading">Login</span>

        <span *ngIf="loading" class="flex items-center justify-center gap-2">
          <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
          Authenticating...
        </span>
      </button>

    </form>

  </div>

</div>
